# One hour of 200-column rows at 1 M rows/s (1376 MB/s), over 512 skewed (Zipf alpha 1.0)
# keys, into a table partitioned by key.
corpus: events-1mrps-skew
kafka:
  partitions: 192
  key: partition_key
  partition_assignment: round_robin
  value_encoding: confluent
producer:
  compression: lz4
  behind_max_ms: 10000
scoring:
  freshness_bound_s: 90
  freshness_max_bound_s: 120
  exactness: EXACTLY_ONCE
  max_warmup_s: 300
table:
  partition: identity(partition_key)
