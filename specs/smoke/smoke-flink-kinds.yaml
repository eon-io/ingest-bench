# Type coverage smoke on the kinds shapes Flink reads from plain Avro (see the kinds-flink preset).
name: smoke-flink-kinds
engine: flink
corpus: kinds-flink
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  # Allow eight slots so the smoke has enough writer capacity on a shared host.
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash
