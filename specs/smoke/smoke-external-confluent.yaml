# External smoke with Confluent framing. Set kafka.schema_registry in the site, then start
# your engine using the staged facts. See docs/adding-an-engine.md for the contract and
# header format.
name: smoke-external-confluent
engine: external
corpus: smoke
table:
  managed_by: harness
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: key
  value_encoding: confluent
scoring:
  freshness_bound_s: 60
  warmup_s: 60
external:
  name: your-engine
  version: "0.0"
  notes: "replace with the engine you are scoring"
fleet:
  - {role: worker, count: 2, vcpu: 2, gib: 2, machine_type: laptop}
