# Local correctness qualification for concurrent Flink appends and Spark rewrites.
# The integration test overrides the smoke corpus to eight partitions and at
# least fifteen minutes; this file keeps the ordinary smoke defaults usable.
# Run the full qualification with the command printed by
# tests/test_compaction_concurrency.py's skip reason.
name: smoke-flink-compact
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
  properties:
    # Small enough to force repeated rewrites in the low-rate local run.
    write.target-file-size-bytes: "8388608"
kafka:
  partitions: 8
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  # Frequent checkpoints create independent files in the same hot partitions,
  # making append commits likely to land inside measured rewrite windows.
  checkpoint_interval: 5s
  min_pause: 1s
  source_parallelism: 4
  distribution_mode: hash
compaction:
  driver: spark-rewrite
  interval_s: 15
  spark-rewrite:
    executors: 1
    executor_cores: 2
    executor_mem_mb: 2048
    rewrite_options:
      min-input-files: "2"
      partial-progress.enabled: "false"
      use-starting-sequence-number: "true"
