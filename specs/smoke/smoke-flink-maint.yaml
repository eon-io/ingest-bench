# Local smoke of Flink's own Iceberg table maintenance: RewriteDataFiles attached
# to the SinkV2 sink's commit stream, in the same job as the writers. Small target
# and floor so rewrites recur at the smoke's low rate; the rate limit is below
# the interval so a 15 s interval is a 15 s cadence (Iceberg's 60 s default would
# hold the trigger for a minute after each pass).
name: smoke-flink-maint
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
  properties:
    write.target-file-size-bytes: "8388608"
kafka:
  partitions: 8
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  checkpoint_interval: 5s
  min_pause: 1s
  source_parallelism: 4
  # Four writer slots and two runner slots of the eight.
  write_parallelism: 4
  distribution_mode: hash
  maintenance:
    rewrite_parallelism: 2
    schedule_interval_s: 15
    rate_limit_s: 5
    lock_check_delay_s: 2
    rewrite_options:
      min-input-files: "2"
      partial-progress.enabled: "false"
compaction:
  driver: inline
