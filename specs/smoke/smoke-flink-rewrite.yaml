# Local smoke of the Flink maintenance sidecar: Iceberg's TableMaintenance as a
# second Flink job rewriting the table the Flink engine appends to. Mirrors
# smoke-flink-compact.yaml with the Spark sidecar swapped for this one.
name: smoke-flink-rewrite
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
  properties:
    # Small enough to force repeated rewrites in the low-rate local run.
    write.target-file-size-bytes: "8388608"
kafka:
  partitions: 8
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 2048
  jm_cpu: 1
  jm_mem_mb: 1024
  # Frequent checkpoints create independent files in the same hot partitions,
  # making append commits likely to land inside measured rewrite windows.
  checkpoint_interval: 5s
  min_pause: 1s
  source_parallelism: 4
  distribution_mode: hash
compaction:
  driver: flink-rewrite
  interval_s: 15
  flink-rewrite:
    rewrite_parallelism: 2
    slots: 2
    tm_cpu: 1
    tm_mem_mb: 2048
    jm_mem_mb: 1024
    # At Iceberg's 60 s default the trigger would ignore the 15 s interval; 5 s
    # keeps the smoke's cadence honest, the cloud spec reasons its own.
    rate_limit_s: 5
    lock_check_delay_s: 2
    rewrite_options:
      min-input-files: "2"
      # Exercises the config path; the planner's "Emitting" lines then run largest first.
      rewrite-job-order: "bytes-desc"
      partial-progress.enabled: "false"
