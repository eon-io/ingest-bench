# Cluster upsert smoke: Flink's upsert sink over the smoke-upsert seed, verified at three samples
# and the end. Build the corpus and its seed with scripts/gen-corpus.sh smoke-upsert first.
name: aws-smoke-upsert-flink
engine: flink
corpus: smoke-upsert
table:
  partition: identity(partition_key)
  # The job converts its equality deletes into deletion vectors, which need format version 3.
  format_version: 3
kafka:
  partitions: 16
  key: event_id
  partition_assignment: corpus
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
  exactness: LATEST_PER_KEY
  geometry_offsets_s: [61, 127, 193]
flink:
  # Set the actual node instance type before publishing; this does not select nodes.
  # machine_type: YOUR_MACHINE_TYPE
  # The fleet of aws-smoke-flink: the offer is the same 5 MB/s.
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash
