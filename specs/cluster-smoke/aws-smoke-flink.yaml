name: aws-smoke-flink
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  # Set the actual node instance type before publishing; this does not select nodes.
  # machine_type: YOUR_MACHINE_TYPE
  # Eight slots, matching local smoke. Give each TaskManager 4 GiB to allow for JVM
  # overhead and managed memory.
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash
