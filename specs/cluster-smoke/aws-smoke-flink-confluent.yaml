# AWS Flink smoke with Confluent framing and schema lookup by ID. Set
# kafka.schema_registry in the site; WITH_SCHEMA_REGISTRY=true deploy/aws/setup.sh can
# deploy a registry.
name: aws-smoke-flink-confluent
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: key
  value_encoding: confluent
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  # Set the actual node instance type before publishing; this does not select nodes.
  # machine_type: YOUR_MACHINE_TYPE
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash
