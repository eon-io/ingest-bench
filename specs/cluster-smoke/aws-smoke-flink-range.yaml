name: aws-smoke-flink-range
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: round_robin
  value_encoding: confluent
producer:
  shards: 1
  compression: lz4
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  machine_type: m6i.xlarge
  taskmanagers: 2
  slots: 2
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: range
  extra_flink_conf:
    range-distribution-statistics-type: "Map"
    range-distribution-sort-key-base-weight: "0.0"
    table.exec.iceberg.use-v2-sink: "false"
