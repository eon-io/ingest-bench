# The local concurrency qualification's shape on the cluster: Flink appending every
# 10 s while the Spark sidecar rewrites every 15 s to an 8 MiB target, against the
# campaign's catalog (Lakekeeper) and images rather than the local rest fixture. The
# five-minute smoke corpus gives ~30 appends and ~20 passes; the full-row snapshot
# check and terminal exactness are what qualify it, not the exit code.
name: aws-smoke-flink-compact
engine: flink
corpus: smoke
table:
  partition: identity(partition_key)
  properties:
    # Small enough to force repeated rewrites in a low-rate run.
    write.target-file-size-bytes: "8388608"
kafka:
  partitions: 4
  key: partition_key
  partition_assignment: key
producer:
  shards: 1
scoring:
  freshness_bound_s: 60
  warmup_s: 60
flink:
  taskmanagers: 2
  slots: 4
  tm_cpu: 2
  tm_mem_mb: 4096
  jm_cpu: 1
  jm_mem_mb: 2048
  checkpoint_interval: 10s
  min_pause: 2s
  source_parallelism: 4
  distribution_mode: hash
compaction:
  driver: spark-rewrite
  interval_s: 15
  spark-rewrite:
    executors: 1
    executor_cores: 2
    executor_mem_mb: 2048
    rewrite_options:
      min-input-files: "2"
      partial-progress.enabled: "false"
      use-starting-sequence-number: "true"
