# Flink-native compaction hour: the published Flink ingest fleet unchanged, plus Iceberg's Flink table maintenance
# (RewriteDataFiles) at rewrite_parallelism 168 on its own m8g.4xlarge nodes (the sidecar group), two 7-slot
# TaskManagers per node. The skew hour at 126 slots rewrote 3.3 MB/s per slot but fell behind: outputs under 256 MiB
# are compacted again (1.29 bytes of work per fresh byte) and each pass carries about 175 s of overhead, so passes
# lengthened toward about 2,000 s. 168 slots bound the pass near 600 s. File groups stay at 1 GiB.
name: aws-1mrps-unif-flink-compact
engine: flink
track: events-1mrps-uniform
producer:
  shards: 69
scoring:
  gate_adaptation_s: 300
flink:
  machine_type: m8g.4xlarge
  jm_machine_type: m8g.2xlarge
  taskmanagers: 18
  # 612 writer subtasks: the busiest holds 4 keys at default max parallelism. 14-vCPU TaskManagers average out
  # the per-TaskManager key count.
  slots: 34
  tm_cpu: 14
  tm_mem_mb: 36864
  jm_cpu: 1
  jm_mem_mb: 4096
  checkpoint_interval: 60s
  min_pause: 2s
  source_parallelism: 96
  distribution_mode: hash
  extra_flink_conf:
    table.exec.iceberg.use-v2-sink: "false"
    taskmanager.memory.jvm-overhead.min: "2g"
    taskmanager.memory.jvm-overhead.max: "2g"
    taskmanager.memory.managed.size: "0m"
    # About 6,500 shuffle channels per TaskManager at 34 slots.
    taskmanager.memory.network.min: "1g"
    taskmanager.memory.network.max: "1g"
    # The direct-memory limit is framework off-heap plus network memory. Without its own allowance, the Kafka
    # fetchers' temporary direct buffers ran out of it before any data.
    taskmanager.memory.task.off-heap.size: "2g"
    taskmanager.load-balance.mode: "TASKS"
    # EKS node group names; replace them with your cluster's.
    kubernetes.taskmanager.node-selector: "eks.amazonaws.com/nodegroup:engine"
    kubernetes.jobmanager.node-selector: "eks.amazonaws.com/nodegroup:shared"
table:
  properties: {write.parquet.compression-codec: zstd, write.parquet.compression-level: "1", write.target-file-size-bytes: "536870912"}
compaction:
  driver: flink-rewrite
  interval_s: 120
  flink-rewrite:
    rewrite_parallelism: 168
    slots: 7
    tm_cpu: 7
    tm_mem_mb: 28672
    jm_cpu: 1
    jm_mem_mb: 2048
    rate_limit_s: 15
    lock_check_delay_s: 10
    machine_type: m8g.4xlarge
    node_selector:
      eks.amazonaws.com/nodegroup: sidecar
    extra_flink_conf:
      taskmanager.memory.jvm-overhead.min: "3g"
      taskmanager.memory.jvm-overhead.max: "3g"
      taskmanager.memory.managed.size: "0m"
    rewrite_options:
      min-input-files: "8"
      min-file-size-bytes: "268435456"
      max-file-group-size-bytes: "1073741824"
      rewrite-all: "false"
      partial-progress.enabled: "false"
      rewrite-job-order: bytes-desc
