name: aws-1mrps-skew-eon-compact-dedup
engine: external
track: events-1mrps-skew
table:
  managed_by: harness
  partition: identity(partition_key)
  properties:
    write.parquet.compression-codec: zstd
    write.parquet.compression-level: "1"
    write.target-file-size-bytes: "536870912"
producer:
  shards: 69
scoring:
  gate_adaptation_s: 300
external:
  name: Eon Data Engine
  version: "4aae9978"
  notes: "Kafka readers and writers one per m8g.4xlarge, committer on m8g.2xlarge, compactors on m8g.4xlarge; 30 s commits; source dedup on; inline compaction bin-packs files under 256 MiB, at least 8 per group, to a 512 MiB target"
compaction:
  driver: inline
# Source dedup on, so the committer has 2 vCPU and 12 GiB for the dedup index.
# Over the hour the committer peaked at 9 GiB and readers at 66% of their memory.
# Compactors reached their 8 GiB limit, and writers peaked at 24 GiB of 28. No pod restarted.
fleet:
  - {role: reader, count: 4, vcpu: 2, gib: 5, machine_type: m8g.4xlarge}
  - {role: writer, count: 5, vcpu: 5, gib: 28, machine_type: m8g.4xlarge}
  - {role: committer, count: 1, vcpu: 2, gib: 12, machine_type: m8g.2xlarge}
  - {role: compactor, count: 7, vcpu: 4, gib: 8, machine_type: m8g.4xlarge}
